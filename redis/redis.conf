# Redis Production Configuration
# Proactive Accountability Assistant

# Network
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Snapshotting (RDB)
# Save the DB to disk:
# save <seconds> <changes>
# Will save the DB if both the given number of seconds and the given
# number of write operations against the DB occurred.

# Save after 15 minutes if at least 1 key changed
save 900 1
# Save after 5 minutes if at least 10 keys changed
save 300 10
# Save after 1 minute if at least 10000 keys changed
save 60 10000

# By default Redis will stop accepting writes if RDB snapshots are enabled
# and the latest background save failed
stop-writes-on-bgsave-error yes

# Compress string objects using LZF when dump .rdb databases
rdbcompression yes

# Add a CRC64 checksum at the end of the file for corruption detection
rdbchecksum yes

# The filename where to dump the DB
dbfilename dump.rdb

# The working directory
dir /data

# Append Only File (AOF)
# AOF provides better durability than RDB snapshots
appendonly yes

# The name of the append only file
appendfilename "appendonly.aof"

# AOF fsync policy:
# - no: don't fsync, just let the OS flush the data when it wants (faster)
# - always: fsync after every write (slower, safest)
# - everysec: fsync only once per second (compromise, recommended)
appendfsync everysec

# Prevent fsync() from being called in the main process while a
# BGSAVE or BGREWRITEAOF is in progress
no-appendfsync-on-rewrite no

# Automatic rewrite of the append only file
# Redis is able to automatically rewrite the log file implicitly calling
# BGREWRITEAOF when the AOF log size grows by the specified percentage
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load truncated AOF file on startup
aof-load-truncated yes

# Use RDB-AOF hybrid persistence (Redis 4.0+)
# This combines the benefits of both RDB and AOF
aof-use-rdb-preamble yes

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Lazy freeing
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no

# Security
# Require clients to authenticate before processing commands
# requirepass your_redis_password_here

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""

# Limits
maxclients 10000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Event notification
notify-keyspace-events ""

# Advanced config
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
aof-rewrite-incremental-fsync yes
