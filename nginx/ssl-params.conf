# SSL/TLS Configuration Parameters
# This file contains recommended SSL/TLS settings for production use
# Include this file in your server block with: include /etc/nginx/ssl-params.conf;

# SSL Protocol versions - TLS 1.2 and 1.3 only (secure)
ssl_protocols TLSv1.2 TLSv1.3;

# SSL Cipher suites - strong ciphers only, prioritizing modern AEAD ciphers
# This configuration achieves an A+ rating on SSL Labs
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

# Let the client choose the cipher (modern browsers choose well)
ssl_prefer_server_ciphers off;

# SSL session cache - improves performance by caching SSL handshakes
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# Disable SSL session tickets for better security (forward secrecy)
ssl_session_tickets off;

# OCSP Stapling - improves SSL handshake performance and privacy
ssl_stapling on;
ssl_stapling_verify on;

# DNS resolvers for OCSP stapling (Google DNS)
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# Diffie-Hellman parameters for DHE ciphers (optional, for older clients)
# Generate with: openssl dhparam -out /etc/nginx/ssl/dhparam.pem 2048
# ssl_dhparam /etc/nginx/ssl/dhparam.pem;

# Security Headers

# HTTP Strict Transport Security (HSTS)
# Tells browsers to always use HTTPS for this domain
# max-age: 1 year (31536000 seconds)
# includeSubDomains: apply to all subdomains
# preload: allow inclusion in browser HSTS preload lists
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# X-Frame-Options - prevents clickjacking attacks
# SAMEORIGIN: allow framing only from same origin
add_header X-Frame-Options "SAMEORIGIN" always;

# X-Content-Type-Options - prevents MIME type sniffing
# nosniff: don't try to guess content type
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection - enables browser XSS filter
# 1; mode=block: enable and block page if XSS detected
add_header X-XSS-Protection "1; mode=block" always;

# Referrer-Policy - controls referrer information
# strict-origin-when-cross-origin: send full URL for same-origin, origin only for cross-origin HTTPS
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content-Security-Policy - prevents XSS and other injection attacks
# Customize this based on your application's needs
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://discord.com; frame-ancestors 'self';" always;

# Permissions-Policy - controls browser features
# Disable geolocation, microphone, and camera access
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
